<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        font-family: Inter, system-ui, sans-serif;
        background: #f5f7fb;
        padding: 40px;
      }
      .card {
        max-width: 420px;
        padding: 24px;
        border-radius: 20px;
        background: white;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
      }
      .badge {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        background: #eef3ff;
        color: #3d68ff;
        font-weight: 700;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 10px;
      }
      p {
        color: #52607a;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">Preview</div>
      <h1>OpenClaw Review Solution</h1>
      <p>This is a local HTML preview sample for review-loop testing.</p>
    </div>
  </body>
</html>
